# Dependabot version updates. Replaces CompatHelper (now in maintenance mode);
# Dependabot supports the Julia ecosystem and updates the [compat] bounds in
# Project.toml. See https://discourse.julialang.org/t/psa-github-dependabot-now-supports-julia/134997
version: 2
updates:
  # Julia package [compat] bounds in Project.toml.
  - package-ecosystem: "julia"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "Bump"

  # Keep the GitHub Actions used by the CI / docs / TagBot workflows current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "Bump"
