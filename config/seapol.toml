# Daisho.jl SEA-POL deployment parameters.
#
# A user configuration for the CSU SEA-POL radar. Load with
# `DaishoParameters("config/seapol.toml")`. Structure and loading rules match
# the bundled template (`print_config("template.toml")`): `[fields]`/`[io]`
# mandatory, `[qc]`/`[gridding]`/`[grid.*]` optional, present blocks strict.
# See `config/defaults.toml` for the full tag vocabulary and gate-state model.

[fields]
DBZ   = ["linear_interp",   "define_detection"]
ZDR   = ["linear_interp"]
KDP   = ["weighted_interp"]
RHOHV = ["weighted_interp"]
VEL   = ["weighted_interp",  "velocity"]
WIDTH = ["weighted_interp"]
PHIDP = ["weighted_interp"]
SQI   = ["weighted_interp",  "define_scanned"]

[qc]
sqi_threshold        = 0.35
snr_threshold        = 6.0
spectrum_width_max   = 8.0
rhohv_threshold      = 0.7

[gridding]
power_threshold = 0.5

[grid.cartesian]
xmin  = -125000.0
xincr =     500.0
xdim  =       501
ymin  = -125000.0
yincr =     500.0
ydim  =       501
zmin  =       0.0
zincr =     500.0
zdim  =        37

[grid.latlon]
lonmin  = 0.0
londim  = 0
latmin  = 0.0
latdim  = 0
degincr = 0.01
zmin    = 0.0
zincr   = 500.0
zdim    = 37

[grid.rhi]
rmin  =     0.0
rincr =   250.0
rdim  =     481
zmin  =     0.0
zincr =   250.0
zdim  =      41

[grid.spectral]
geometry   = "RRR"
mubar      = 3
quadrature = "gauss"
xmin       = -125000.0
xmax       =  125000.0
xdim       = 50
ymin       = -125000.0
ymax       =  125000.0
ydim       = 50
zmin       = 0.0
zmax       = 15000.0
zdim       = 10

[grid.spectral.bc.xL]
type = "natural"
[grid.spectral.bc.xR]
type = "natural"
[grid.spectral.bc.yL]
type = "natural"
[grid.spectral.bc.yR]
type = "natural"
[grid.spectral.bc.zL]
type = "natural"
[grid.spectral.bc.zR]
type = "natural"

[grid.metadata]
Conventions      = "CF-1.12"
history          = "v1.0"
institution      = "Colorado State University"
source           = "CSU SEA-POL radar"
instrument       = "SEA-POL"
title            = "Level 4 Gridded SEA-POL Radar Data"
summary          = "Level 4 Gridded SEA-POL Radar Data"
creator_name     = "Michael M. Bell"
creator_email    = "mmbell@colostate.edu"
creator_id       = "https://orcid.org/0000-0002-0496-331X"
project          = "PICCOLO, BOWTIE, ORCESTRA"
platform         = "RV METEOR"
keywords         = "radar, precipitation, sea-pol"
processing_level = "Level 4"
license          = "CC-BY-4.0"
references       = ""

[io]
fill_value = -32768.0   # CF _FillValue  — true missing (gate not measured)
undetect   =  -9999.0   # ODIM _Undetect — undetect (scanned, no echo)
