# Daisho.jl parameter template.
#
# This file is the canonical template for `DaishoParameters`. To start a new
# configuration, copy it from inside Julia:
#
#     using Daisho
#     print_config("mygrid.toml")
#
# Then edit `mygrid.toml` and load it with `DaishoParameters("mygrid.toml")`.
#
# Loading rules:
#   * `[fields]` and `[io]` are MANDATORY (no sensible default).
#   * `[qc]`, `[gridding]`, and the `[grid.*]` sub-tables are OPTIONAL — they
#     default-construct when omitted. An operation that actually needs a
#     missing block raises a clear error naming the operation and the block.
#   * Any block that IS present is validated strictly: unknown or mis-typed
#     keys raise an error at load time, naming the offending section. There is
#     no silent fallback to defaults for a present-but-incomplete block.
#
# Structure mirrors the `DaishoParameters` struct hierarchy:
#   [fields]               -> p.moments      (flat per-field tag array)
#   [qc]                   -> p.qc
#   [gridding]             -> p.gridding
#   [grid.cartesian]       -> p.grid.cartesian
#   [grid.latlon]          -> p.grid.latlon
#   [grid.rhi]             -> p.grid.rhi
#   [grid.spectral]        -> p.grid.spectral
#   [grid.spectral.bc.*]   -> p.grid.spectral.bc.*  (sub-table per axis side)
#   [grid.metadata]        -> p.grid.metadata  (CF global attrs for outputs)
#   [io]                   -> p.io
#
# ── [fields] tag vocabulary ──────────────────────────────────────────────────
# Each field maps to a flat ARRAY of tags `[ ... ]`. No tag is required;
# field order and tag order are insignificant (internal column order is
# derived deterministically by sorted field name).
#
# Interpolation (gridding-domain; AT MOST ONE per field; default `weighted`):
#   linear_interp    convert to linear units before averaging, back to dB
#                    after (reflectivity-like).
#   weighted_interp  weighted average in native units (the default).
#   nearest_interp   winner-take-all (keep the highest-weight gate).
#
# Role tags (consumed when a gridding driver runs; AT MOST ONE field each;
# required only at point-of-use, not at load):
#   define_detection  the field whose PRESENCE at a gate proves a detectable
#                      echo. Such gates set a valid cell (was `valid_key`).
#   define_scanned    the field whose PRESENCE at a gate proves the gate was
#                      scanned. Marks the cell scanned (was `missing_key`).
#
# Reserved (a known tag, consumed by nothing yet):
#   velocity          future multi-Doppler radial-velocity selector.
#
# ── Three gate states (CfRadial 2.1 / ODIM) ──────────────────────────────────
#   true missing  gate not measured        -> [io] fill_value (CF _FillValue)
#   undetect      scanned, no echo (clear)  -> [io] undetect  (ODIM _Undetect)
#   valid         scanned, signal detected  -> the measured value
# `undetect` is DERIVED, not a tag: a cell that is define_scanned-present but
# has no define_detection gate is scanned-but-no-echo. Clear air is the
# absence of an echo, so no field can "define" it — this asymmetry is
# intentional.

[fields]
DBZ   = ["linear_interp",   "define_detection"]
ZDR   = ["linear_interp"]
KDP   = ["weighted_interp"]
RHOHV = ["weighted_interp"]
VEL   = ["weighted_interp",  "velocity"]
WIDTH = ["weighted_interp"]
PHIDP = ["weighted_interp"]
SQI   = ["weighted_interp",  "define_scanned"]

[qc]
sqi_threshold        = 0.35
snr_threshold        = 6.0
spectrum_width_max   = 8.0
rhohv_threshold      = 0.7

[gridding]
beam_inflation  = 0.01
power_threshold = 0.5

[grid.cartesian]
xmin  = -125000.0
xincr =     500.0
xdim  =       501
ymin  = -125000.0
yincr =     500.0
ydim  =       501
zmin  =       0.0
zincr =     500.0
zdim  =        37

[grid.latlon]
# lon/lat domain bounds; degincr is the angular grid spacing.
# Defaults left at 0 — populate per-experiment in user TOML.
lonmin  = 0.0
londim  = 0
latmin  = 0.0
latdim  = 0
degincr = 0.01
zmin    = 0.0
zincr   = 500.0
zdim    = 37

[grid.rhi]
rmin  =     0.0
rincr =   250.0
rdim  =     481
zmin  =     0.0
zincr =   250.0
zdim  =      41

[grid.spectral]
# Spectral grid for Springsteel. xdim/ydim/zdim count B-spline cells (not
# physical points); physical points = cells * mubar.
geometry   = "RRR"     # "R" | "RR" | "RRR"
mubar      = 3
quadrature = "gauss"   # "gauss" | "regular"
xmin       = -125000.0
xmax       =  125000.0
xdim       = 50
ymin       = -125000.0
ymax       =  125000.0
ydim       = 50
zmin       = 0.0
zmax       = 15000.0
zdim       = 10

# Boundary conditions per axis side. Each sub-table has a `type` key plus any
# numeric parameters required by that BC. Recognized types:
#   natural | dirichlet | neumann | second_derivative | robin | periodic
#   exponential | cauchy | antisymmetric | symmetric | zeros
[grid.spectral.bc.xL]
type = "natural"
[grid.spectral.bc.xR]
type = "natural"
[grid.spectral.bc.yL]
type = "natural"
[grid.spectral.bc.yR]
type = "natural"
[grid.spectral.bc.zL]
type = "natural"
[grid.spectral.bc.zR]
type = "natural"

# CF-1.12 global attributes copied into every gridded NetCDF output. Every
# key below must be present in your config; the values shipped here are
# generic placeholders — edit them for your deployment. The `references`
# slot may be left as `""`; the empty string suppresses the corresponding
# NetCDF global attribute on write.
[grid.metadata]
Conventions      = "CF-1.12"
history          = "v1.0"
institution      = "Your Institution"
source           = "Your radar"
instrument       = "Radar"
title            = "Gridded Radar Data"
summary          = "Gridded Radar Data"
creator_name     = "Data Creator"
creator_email    = ""
creator_id       = ""
project          = ""
platform         = ""
keywords         = "radar, precipitation"
processing_level = "Level 4"
license          = "CC-BY-4.0"
references       = ""

# Output sentinels, named to match the CfRadial 2.1 / ODIM data model and
# FieldMetadata exactly. These are authoritative across the gridding /
# finalize / NetCDF-write path; the defaults are NOT a universal convention.
[io]
fill_value = -32768.0   # CF _FillValue  — true missing (gate not measured)
undetect   =  -9999.0   # ODIM _Undetect — undetect (scanned, no echo)
