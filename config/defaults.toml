# Daisho.jl parameter template.
#
# This file is the canonical template for `DaishoParameters`. To start a new
# configuration, copy it from inside Julia:
#
#     using Daisho
#     print_config("mygrid.toml")
#
# Then edit `mygrid.toml` and load it with `DaishoParameters("mygrid.toml")`.
#
# Loading rules:
#   * `[fields]` and `[io]` are MANDATORY (no sensible default).
#   * `[qc]`, `[gridding]`, and the `[grid.*]` sub-tables are OPTIONAL — they
#     default-construct when omitted. An operation that actually needs a
#     missing block raises a clear error naming the operation and the block.
#   * Any block that IS present is validated strictly: unknown or mis-typed
#     keys raise an error at load time, naming the offending section. There is
#     no silent fallback to defaults for a present-but-incomplete block.
#
# Structure mirrors the `DaishoParameters` struct hierarchy:
#   [fields]               -> p.moments      (flat per-field tag array)
#   [io]                   -> p.io
#   [qc]                   -> p.qc
#   [gridding]             -> p.gridding
#   [grid.cartesian]          -> p.grid.cartesian  (shared base for the products below)
#   [grid.volume]             -> p.grid.volume     (grid_radar_volume;    falls back to cartesian)
#   [grid.composite]          -> p.grid.composite  (grid_radar_composite; falls back to cartesian)
#   [grid.ppi]                -> p.grid.ppi         (grid_radar_ppi;       falls back to cartesian)
#   [grid.column]             -> p.grid.column     (grid_radar_column/QVP; falls back to cartesian)
#   [grid.latlon]             -> p.grid.latlon
#   [grid.rhi]                -> p.grid.rhi
#   [grid.springsteel]        -> p.grid.springsteel  (Springsteel spectral grid)
#   [grid.springsteel.i/j/k]  -> p.grid.springsteel.i/j/k  (per-axis spec + bc)
#   [grid.metadata]           -> p.grid.metadata  (CF global attrs for outputs)
#
# ── [fields] tag vocabulary ──────────────────────────────────────────────────
# Each field maps to a flat ARRAY of tags `[ ... ]`. No tag is required;
# field order and tag order are insignificant (internal column order is
# derived deterministically by sorted field name).
#
# Interpolation (gridding-domain; AT MOST ONE per field; default `weighted`):
#   linear_interp    convert to linear units before averaging, back to dB
#                    after (reflectivity-like).
#   weighted_interp  weighted average in native units (the default).
#   nearest_interp   winner-take-all (keep the highest-weight gate).
#
# Role tags (consumed when a gridding driver runs; AT MOST ONE field each;
# required only at point-of-use, not at load):
#   define_detection  the field whose PRESENCE at a gate proves a detectable
#                      echo. Such gates set a valid cell (was `valid_key`).
#   define_scanned    the field whose PRESENCE at a gate proves the gate was
#                      scanned. Marks the cell scanned (was `missing_key`).
#
#   velocity          the radial-velocity field. Its presence selects the
#                      multi-Doppler wind synthesis (WindGridAccumulator), which
#                      also grids every scalar field.
#   reflectivity      the gate reflectivity (dBZ) used by the hydrometeor
#                      fall-speed correction ([synthesis.fall_speed]).
#   spectrum_width    the gate spectrum width (m/s) used by the per-gate
#                      velocity error model ([synthesis.gate_error]); optional
#                      even then (the SW term is omitted without it).
#   beam_height       take the value from each gate's geometry (see below).
#
# ── Three gate states (CfRadial 2.1 / ODIM) ──────────────────────────────────
#   true missing  gate not measured        -> [io] fill_value (CF _FillValue)
#   undetect      scanned, no echo (clear)  -> [io] undetect  (ODIM _Undetect)
#   valid         scanned, signal detected  -> the measured value
# `undetect` is DERIVED, not a tag: a cell that is define_scanned-present but
# has no define_detection gate is scanned-but-no-echo. Clear air is the
# absence of an echo, so no field can "define" it — this asymmetry is
# intentional.

[fields]
DBZ   = ["linear_interp",   "define_detection", "reflectivity"]
VEL   = ["weighted_interp",  "velocity"]
WIDTH = ["weighted_interp",  "spectrum_width"]
SQI   = ["weighted_interp",  "define_scanned"]
# A `beam_height` field takes its value from each gate's geometry (elevation +
# range), gridded as a beam-power-weighted mean — a per-cell height even on 2-D
# PPI/RHI grids (no Z axis). Useful on its own and as the [echo] height_field so
# the profile temperature source works on PPIs. Uncomment to enable:
# HEIGHT = ["beam_height"]

# Output flags, named to match the CfRadial 2.1 / ODIM data model and
# FieldMetadata exactly.
[io]
fill_value = -32768.0   # CF _FillValue  — true missing (gate not measured)
undetect   =  -9999.0   # ODIM _Undetect — undetect (scanned, no echo)

[qc]
sqi_threshold        = 0.35
snr_threshold        = 6.0
spectrum_width_max   = 8.0
rhohv_threshold      = 0.7

[gridding]
# Beam power level defining the beam edge. The edge-referenced gate inclusion sets
# the beam half-angle to beam_cutoff = ln(1/power_threshold)/beam_coef, so LOWER
# power_threshold ⇒ WIDER beam (more of the exponential tail counts). 0.5 is the
# half-power half-beamwidth.
power_threshold = 0.5
# ROI = grid increment × factor; the box half-width/half-height for gate
# inclusion. Optional (default 0.75 each).
horizontal_roi_factor = 0.75
vertical_roi_factor   = 0.75
# Numerical guards on the near-radar range_weight singularity. Optional.
range_guard_min  = 1.0    # metres; lower clamp on the slant-range divisor
range_weight_max = 10.0   # upper clamp on the (unitless) range_weight
# Slant-range gate-inclusion filter (optional). A gate is gridded only when its
# slant range r is within [range_minimum, range_maximum] metres; out-of-range
# gates are excluded. Distinct from the weighting guards above. Defaults apply no
# filtering. These are the GLOBAL defaults; any product may override them in its
# own [grid.<product>] table (see below) — e.g. cap the volume at 120 km while the
# composite/PPI stay full-range, all in one file.
range_minimum = 0.0        # metres; lower bound on gate slant range (global default)
# range_maximum = 150000.0 # metres; upper bound — omit for no limit (default Inf)

# Hydrostatic reference-density profile rho-bar(z). OPTIONAL — defaults to the
# exponential profile below when absent. Shared by the variational-stage mass
# continuity constraint, the radar fall-speed correction, and (a future phase)
# FHC temperature.
[reference_state]
source                 = "exponential"   # "exponential" | "sounding"
# Sounding source only (samurai/Scythe format: a surface line "p_sfc theta qv",
# then "z theta qv" per level; qv in g/kg). Required (and must exist) when
# source = "sounding":
# sounding_file        = "sounding.txt"
# moisture             = true            # include vapor density in rho-bar
# Exponential source only: rho-bar(z) = density_surface_kg_m3 * exp(-z / density_scale_height_m)
density_surface_kg_m3  = 1.2
density_scale_height_m = 8500.0
# Exponential source only, optional: a linear temperature lapse T(z) = T0 - Gamma*z,
# needed for melting-layer derivation from this source. Commented out = no
# temperature profile (freezing_level_m / temperature_celsius unavailable).
# temperature_surface_k = 300.0
# lapse_rate_k_m        = 0.0065

# Stage-1 dual-Doppler retrieval QC. Quality is judged ONLY by the per-component
# normalized uncertainty (CEDRIC DTEST style), evaluated IN THE OUTPUT FRAME;
# there is no radar count or gate count threshold — geometry adequacy already
# shows up in sigma. Masking is NON-DESTRUCTIVE: where solvable, the components
# and their sigmas are always written; the quality flag records which sigma
# threshold(s) failed so stage 2 can still recover those points.
[synthesis]
velocity_variance = 1.0   # assumed σ_vr² (m/s)²; 1.0 → normalized (CEDRIC USTD/VSTD) units
# Frame is Cartesian for stage 1, so component 1/2 = U/V. The two thresholds are
# independent (component 1 may be well-determined while component 2 is not). For
# future plane/polar frames these bind to in-plane/cross-plane or tangential/radial.
max_sigma_1       = 2.0   # max normalized σ on output component 1 (U for CartesianFrame)
max_sigma_2       = 2.0   # max normalized σ on output component 2 (V for CartesianFrame)
# Max line-of-sight elevation (deg) a gate may have to enter the 2-unknown (u,v)
# solve; the dropped w·sin(el) term contaminates steep beams (airborne tail
# radars reach ±70°). Above this, gates still grid scalars but not the wind.
# Optional; defaults to 45.0. Applied only when include_vertical_velocity = false
# (in the 3-unknown system steep beams observe w and are kept).
max_elevation     = 45.0
# Accumulate the (u,v,w) 3x3 normal system (g = [sin az cos el, cos az cos el,
# sin el]) instead of the (u,v) 2x2 one. Needed by the variational stage. The
# stage-1 U/V product is unchanged in meaning (the (u,v) block is solved).
# Optional; defaults to false.
include_vertical_velocity = false

# Hydrometeor fall-speed correction of each gate's radial velocity (samurai
# relations), OPTIONAL. Uncomment the table to enable it (a present table means
# enabled; every key is optional and defaults as shown). Needs a [fields] entry
# tagged `reflectivity`. Fall speeds are negative (downward), in m/s:
#   w_t = -coefficient * Z^exponent * (rho(0)/rho(z))^density_exponent, Z linear
# with rho from [reference_state]; the corrected value is v_r - w_t*sin(el).
# Below the melting layer the rain relation is used; above it, snow at or below
# mixed_phase_dbz, rain above rain_dbz, linear in dBZ between; across the
# melting layer, linear in height between the two.
# [synthesis.fall_speed]
# rain_coefficient       = 2.6      # rain: coefficient (m/s), Joss & Waldvogel (1971)
# rain_exponent          = 0.107    # rain: exponent on linear Z
# snow_coefficient       = 0.817    # snow: coefficient (m/s), Atlas et al. (1973)
# snow_exponent          = 0.063    # snow: exponent on linear Z
# density_exponent       = 0.45     # exponent on rho(0)/rho(z), Beard (1985)
# mixed_phase_dbz        = 20.0     # dBZ at/below which the above-layer speed is snow
# rain_dbz               = 30.0     # dBZ above which the above-layer speed is rain
# melting_layer_bottom_m = 4500.0   # m; absent => the [reference_state] freezing level
#                                   #   (an error if that profile has no temperature)
# melting_layer_depth_m  = 1000.0   # m; height-blend depth above melting_layer_bottom_m

# Per-gate radial-velocity error model, OPTIONAL. Uncomment to enable (every key
# optional). Per-gate sigma (m/s):
#   sigma = max(error_guard_min_m_s, |sin(el)|*fall_speed_error_m_s + SW*spectrum_width_error_factor)
# folded into the gridding weight as w' = w * velocity_variance / sigma^2. The SW
# term needs a [fields] entry tagged `spectrum_width` (omitted otherwise).
# [synthesis.gate_error]
# fall_speed_error_m_s        = 2.0   # m/s, scaled by |sin(el)|
# spectrum_width_error_factor = 1.0   # multiplier on the gate spectrum width
# error_guard_min_m_s         = 1.0   # m/s; lower clamp (stability guard) on sigma

# Incremental 3DVAR wind solver (variational stage), OPTIONAL. The block (and
# its sub-tables) validates strictly whether or not it is enabled, so a config
# exercises the whole schema before flipping the switch; absent entirely ⇒
# defaults (disabled, [fields]-independent).
[variational]
enabled = false
# State-vector variable names, in control-variable order: "U"/"V"/"W" or a
# [fields] name (appended as a value-observed scalar state variable). Must
# be non-empty, unique, and contain both "U" and "V".
state = ["U", "V", "W"]
background = "zero"                  # "zero" | "synthesis" (stage-1 (u,v) as background)
background_error_inflation = 1.0     # multiplies sigma_b when background = "synthesis"
                                      # (guards against double-counting stage-1 uncertainty)
# Enforce anelastic mass continuity (div(u,v) + dw/dz + w*dlnrhobar/dz = 0) as
# a pseudo-observation at every mish point. Requires "W" in state.
mass_continuity = true
mass_continuity_sigma_per_s = 1.0e-4 # sigma of the divergence residual (s^-1); 1/sigma^2 weight
max_outer_iterations = 1             # outer Gauss-Newton loops; >1 only matters with nonlinear obs
max_inner_iterations = 200           # inner conjugate-gradient iterations per outer loop
inner_tolerance = 1.0e-4             # relative CG residual stopping tolerance, in (0, 1)
outer_tolerance = 1.0e-3             # relative increment-norm stopping tolerance, in (0, 1)
output_background = false            # write *_BACKGROUND fields
output_increment  = false            # write *_INCREMENT fields
output_mish       = false            # also write mish-lattice fields + stage-1/super-obs diagnostics
filter_type = "gaussian"             # "gaussian" | "lanczos" (Lanczos has negative lobes near boundaries)

# Per-state-variable background error: sigma (native units: m/s for winds)
# and the mish-space filter length in METRES along each (i, j, k) axis (0 on
# an axis disables filtering there). "default" applies to any state variable
# without its own entry; every state variable must resolve one or the other.
[variational.background_error]
default = { sigma = 10.0, filter_length_m = [2000.0, 2000.0, 500.0] }
W       = { sigma = 2.0,  filter_length_m = [2000.0, 2000.0, 500.0] }
# DBZ   = { sigma = 10.0, filter_length_m = [1000.0, 1000.0, 250.0] }

# Radial-velocity super-observation parameters (from the stage-1 accumulator's
# per-point normal system). Every key optional.
[variational.radial_velocity]
error_inflation = 1.0               # multiplies sigma^2_vr for the super-obs only
horizontal_approximation = false    # drop the w*sin(el) term (samurai horizontal_radar_appx);
                                     # allows [synthesis] include_vertical_velocity = false
eigenvalue_guard_relative = 1.0e-10 # eigendirections below this fraction of lambda_max emit no obs

# One [variational.scalar_obs.<name>] table is REQUIRED for every [fields]
# name appearing in `state` above, e.g.:
# [variational.scalar_obs.DBZ]
# sigma = 5.0             # observation-error sigma, native field units
# undetect_value = -10.0  # value substituted for an [io] undetect gate

# Optional explicit role override (values from: wind_u, wind_v, wind_w,
# reflectivity, scalar); without it, roles resolve automatically (U/V ->
# wind_u/wind_v, W -> wind_w, a `reflectivity`-tagged field -> reflectivity,
# any other [fields] name -> scalar):
# [variational.roles]
# W = "wind_w"

# Shared Cartesian base geometry. The volume, composite, ppi, and column (QVP)
# products all read this unless they have their own override section below.
[grid.cartesian]
xmin  = -125000.0
xincr =     500.0
xdim  =       501
ymin  = -125000.0
yincr =     500.0
ydim  =       501
zmin  =       0.0
zincr =     500.0
zdim  =        37

# Per-product Cartesian overrides. Each is OPTIONAL and inherits [grid.cartesian]
# when omitted, so define one only when that product needs a different geometry.
# All four use the CartesianGridParameters schema (the same keys as
# [grid.cartesian]); composite/ppi ignore the z-axis fields and column uses only
# the z-axis fields.
#   [grid.volume]      # grid_radar_volume     (full 3D x/y/z)
#   [grid.composite]   # grid_radar_composite  (2D x/y, z ignored)
#   [grid.ppi]         # grid_radar_ppi        (2D x/y, z ignored)
#   [grid.column]      # grid_radar_column/QVP (z only, x/y ignored)
# Each may also set `range_minimum`/`range_maximum` to override the [gridding]
# global slant-range filter for that product only (omit to inherit the global).
# Example: cap the volume at 120 km (it combines scans of differing max range)
# while composite/ppi stay full-range —
#   [grid.volume]
#   range_maximum = 120000.0

[grid.latlon]
# lon/lat domain bounds; degincr is the angular grid spacing.
# Defaults left at 0 — populate per-experiment in user TOML.
lonmin  = 0.0
londim  = 0
latmin  = 0.0
latdim  = 0
degincr = 0.01
zmin    = 0.0
zincr   = 500.0
zdim    = 37

[grid.rhi]
rmin  =     0.0
rincr =   250.0
rdim  =     481
zmin  =     0.0
zincr =   250.0
zdim  =      41

# Springsteel spectral grid. The section speaks Springsteel's native i/j/k
# axis vocabulary, because x/y/z only makes sense for Cartesian geometries:
#   i = easting (Cartesian) or radius (cylindrical/spherical)
#   j = northing (Cartesian) or azimuth (auto-sized Fourier)
#   k = altitude
# Supported geometries: R, RZ, RR, RRR (Cartesian); RL, RLZ, RLR (cylindrical);
# SL, SLZ, SLR (spherical). Per-axis keys depend on the basis the geometry
# puts on the axis:
#   B-spline axes  -> min, max, cells   (cells counts B-spline CELLS, not
#                     gridpoints — physical quadrature points = cells × mubar;
#                     unlike [grid.cartesian], whose dims count gridpoints)
#   Chebyshev axes -> min, max, points  (the k of RZ/RLZ/SLZ)
#   Fourier axes   -> auto-sized; optional max_wavenumber only (the j of
#                     RL*/SL*; periodic by construction)
# Every axis with output may set `regular_out`: the number of regularly
# spaced points write_radar_netcdf resamples onto along that axis. Default:
# cells + 1 on B-spline axes (clean cell-edge spacing), Springsteel's default
# otherwise.
# The Springsteel variable map is always derived from [fields]; it is not
# configured here. Grids beyond this schema (per-variable spectral filters,
# Fourier/Chebyshev-primary geometries): build the grid in Julia with
# Springsteel.SpringsteelGridParameters(vars = radar_vars(p), ...) +
# createGrid and pass it to the gridding entry points directly.
[grid.springsteel]
geometry   = "RRR"
mubar      = 3
quadrature = "gauss"   # "gauss" | "regular"

[grid.springsteel.i]
min   = -125000.0
max   =  125000.0
cells = 50

# Boundary conditions per axis: the `min`/`max` keys set that side's default
# BC; any other key names a field and gives per-field overrides, e.g.
#   DBZ = { min = { type = "dirichlet", value = 0.0 } }
# Recognized types:
#   natural | dirichlet | neumann | second_derivative | robin | periodic
#   exponential | cauchy | antisymmetric | symmetric | zeros
# Parameterless types may be written as plain strings; parameterized ones as
# tables, e.g. { type = "robin", alpha = 1.0, beta = -2.0, gamma = 0.0 }.
[grid.springsteel.i.bc]
min = "natural"
max = "natural"

[grid.springsteel.j]
min   = -125000.0
max   =  125000.0
cells = 50

[grid.springsteel.j.bc]
min = "natural"
max = "natural"

[grid.springsteel.k]
min   = 0.0
max   = 15000.0
cells = 10

[grid.springsteel.k.bc]
min = "natural"
max = "natural"
# When [variational] is enabled, its state variables (U, V, W — not [fields]
# entries) reuse this same per-field override table by name, e.g. w = 0 at
# the surface (Dirichlet on the k-min side):
# W = { min = "dirichlet" }

# CF-1.12 global attributes copied into every gridded NetCDF output. Every
# key below must be present in your config; the values shipped here are
# generic placeholders — edit them for your deployment. The `references`
# slot may be left as `""`; the empty string suppresses the corresponding
# NetCDF global attribute on write.
[grid.metadata]
Conventions      = "CF-1.12"
history          = "v1.0"
institution      = "Your Institution"
source           = "Your radar"
instrument       = "Radar"
title            = "Gridded Radar Data"
summary          = "Gridded Radar Data"
creator_name     = "Data Creator"
creator_email    = ""
creator_id       = ""
project          = ""
platform         = ""
keywords         = "radar, precipitation"
processing_level = "Level 4"
license          = "CC-BY-4.0"
references       = ""

# ── Echo products (post-gridding) ────────────────────────────────────────────
# Fuzzy hydrometeor identification (HID/FHC) and polarimetric rain rate, computed
# from the GRIDDED radar variables (beam-power-weighted averages) — not gridded as
# echo products themselves. CSU_RadarTools ports (csu_fhc_summer, the warm-
# season FHC; calc_blended_rain_tropical, Thompson et al. 2016). Applied as an
# in-grid step (post-finalize, pre-write) and/or standalone via
# `add_echo_products!` on already-written grids (incl. multi-time files).
# This block is OPTIONAL; the section is shown disabled as a starting template.
[echo]
enabled              = false        # master switch
band                 = "S"          # "S", "C", or "X"
compute_fhc          = true         # write hydrometeor classification
compute_blended_rain = true         # write blended rain rate
# Individual rain components to also write (any subset). Useful for visualization
# and as fallbacks when blended inputs (e.g. Kdp) are missing/noisy:
#   RATE_Z, RATE_Z_CONV, RATE_Z_STRAT, RATE_KDP, RATE_Z_ZDR, RATE_KDP_ZDR
rain_components      = []
# Input field names read from the grid (ldr_field = "" disables LDR):
dbz_field            = "DBZ"
zdr_field            = "ZDR"
kdp_field            = "KDP"
rhohv_field          = "RHOHV"
ldr_field            = ""
# FHC options:
fhc_method           = "hybrid"     # "hybrid" or "linear"
use_temp             = true         # include temperature in the FHC
# Temperature source:
#   "profile"         the [echo.temperature] piecewise-linear T(z) below
#   "field"           a gridded temperature field (temp_field), used per cell
#   "reference_state" future Springsteel reference state (not yet implemented)
temp_source          = "profile"
temp_field           = "TEMP_FOR_PID"  # gridded temperature field (temp_source = "field")
temp_field_units     = "C"          # units of temp_field: "C" or "K" (K converted to C)
# For temp_source = "profile" on a 2-D PPI/RHI grid (no Z axis), set height_field
# to a gridded beam_height field (e.g. "HEIGHT") so the profile can be sampled per
# cell; empty uses the grid z-axis (3-D only).
height_field         = ""
temp_factor          = 1.0          # > 1 broadens the temperature membership functions
correct_ice_method   = true         # hail-only rain method label (fixes a Python bug)
# Output variable names:
fhc_output           = "HID_CSU"
rain_output          = "RATE_CSU_BLENDED"
rain_method_output   = ""           # "" suppresses the method field

# FHC per-variable weights (hybrid uses only the polarimetric weights).
[echo.weights]
DZ = 1.5
DR = 0.8
KD = 1.0
RH = 0.8
LD = 0.5
T  = 0.4

# Temperature profile T(z): height (m) -> temperature (°C), linearly interpolated.
# Temporary stand-in for a future shared hydrostatic reference state. Provide
# `heights` + `temperatures`, or a 2-column `file`, or a `profile` of [h, T] pairs.
[echo.temperature]
heights      = [0.0,  1000.0, 3000.0, 5000.0, 10000.0, 15000.0]
temperatures = [25.0, 18.0,    5.0,   -8.0,   -40.0,   -70.0]

# Hybrid scan: collapse a set of same-time gridded PPI tilts into one near-surface
# 2-D product. Starts from the base (lowest) tilt and, wherever that tilt has no
# measurement, looks upward through the higher tilts, taking the first whose beam
# is still at or below beam_height_maximum at that cell. Runs AFTER [echo], since
# the fields it usually carries (rain rate, HID) are echo outputs.
[hybrid_scan]
enabled              = false        # master switch
# Fields carried through the selection. Empty = every field present in the tilts,
# which keeps the output a drop-in gridded PPI for the readers and plotters.
fields               = []
select_field         = "DBZ"        # field whose validity decides the selection
# Preferred base tilt in degrees. Comment out (or set no value) to always use the
# lowest tilt available in the set; when the configured angle is absent from a
# given set, the lowest available tilt is used instead.
base_angle           = 0.5
base_angle_tolerance = 0.05         # degrees; how close a tilt must be to count as base_angle
beam_height_maximum  = 1000.0       # metres; a tilt above the base may only fill cells at or below this
radar_altitude       = 0.0          # metres; antenna height for the geometric beam-height fallback
# What counts as a tilt having ANSWERED a cell -- applied the same way at the base tilt
# and at the tilts above it, so the search always stops at the lowest tilt with an answer.
#   false: any non-fill_value reading answers, so a tilt reporting undetect has observed
#          clear air and ends the search (the lowest measurement of any kind).
#   true:  only a real detection answers, so the search climbs past clear air looking
#          for echo (the lowest rain).
require_detection    = false
# Gridded beam-height field (e.g. a field tagged beam_height). When set and present
# it supplies per-tilt heights in preference to the geometric fallback.
height_field         = ""
# Output variable names ("" suppresses):
elevation_output     = "elevation_angle"   # which tilt supplied each cell
height_output        = ""                  # beam height of the selected tilt
# Fallback regex (one capture group) recovering the tilt angle from a gridded PPI
# filename, for archives written before Daisho stored `fixed_angle` in the file.
# Empty = read the file's fixed_angle only. Example for gridded_ppi_..._0.5.nc:
# angle_pattern      = "_([0-9]+\\.[0-9]+)\\.nc$"
angle_pattern        = ""
