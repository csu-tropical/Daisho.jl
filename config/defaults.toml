# Daisho.jl default parameters.
#
# Loaded by `DaishoParameters()` (no args). User TOML files passed to
# `DaishoParameters(path)` are deep-merged over these defaults, so user files
# only need to specify keys they wish to override.
#
# Structure mirrors the `DaishoParameters` struct hierarchy exactly:
#   [fields]               -> p.moments  (CfRadial 2.1: dropped raw/qc split)
#   [qc]                   -> p.qc
#   [gridding]             -> p.gridding
#   [grid.cartesian]       -> p.grid.cartesian
#   [grid.latlon]          -> p.grid.latlon
#   [grid.rhi]             -> p.grid.rhi
#   [grid.spectral]        -> p.grid.spectral
#   [grid.spectral.bc.*]   -> p.grid.spectral.bc.*  (sub-table per axis side)
#   [io]                   -> p.io

[fields]
names = ["DBZ", "ZDR", "KDP", "RHOHV", "VEL", "WIDTH", "PHIDP", "SQI"]

[fields.grid_type]
DBZ   = "linear"
ZDR   = "linear"
KDP   = "weighted"
RHOHV = "weighted"
VEL   = "weighted"
WIDTH = "weighted"
PHIDP = "weighted"
SQI   = "weighted"

[qc]
sqi_threshold        = 0.35
snr_threshold        = 6.0
spectrum_width_max   = 8.0
rhohv_threshold      = 0.7

[gridding]
beam_inflation  = 0.01
power_threshold = 0.5
missing_key     = "SQI"
valid_key       = "DBZ"

[grid.cartesian]
xmin  = -125000.0
xincr =     500.0
xdim  =       501
ymin  = -125000.0
yincr =     500.0
ydim  =       501
zmin  =       0.0
zincr =     500.0
zdim  =        37

[grid.latlon]
# lon/lat domain bounds; degincr is the angular grid spacing.
# Defaults left at 0 — populate per-experiment in user TOML.
lonmin  = 0.0
londim  = 0
latmin  = 0.0
latdim  = 0
degincr = 0.01
zmin    = 0.0
zincr   = 500.0
zdim    = 37

[grid.rhi]
rmin  =     0.0
rincr =   250.0
rdim  =     481
zmin  =     0.0
zincr =   250.0
zdim  =      41

[grid.spectral]
# Spectral grid for Springsteel. xdim/ydim/zdim count B-spline cells (not
# physical points); physical points = cells * mubar.
geometry   = "RRR"     # "R" | "RR" | "RRR"
mubar      = 3
quadrature = "gauss"   # "gauss" | "regular"
xmin       = -125000.0
xmax       =  125000.0
xdim       = 50
ymin       = -125000.0
ymax       =  125000.0
ydim       = 50
zmin       = 0.0
zmax       = 15000.0
zdim       = 10

# Boundary conditions per axis side. Each sub-table has a `type` key plus any
# numeric parameters required by that BC. Recognized types:
#   natural | dirichlet | neumann | second_derivative | robin | periodic
#   exponential | cauchy | antisymmetric | symmetric | zeros
[grid.spectral.bc.xL]
type = "natural"
[grid.spectral.bc.xR]
type = "natural"
[grid.spectral.bc.yL]
type = "natural"
[grid.spectral.bc.yR]
type = "natural"
[grid.spectral.bc.zL]
type = "natural"
[grid.spectral.bc.zR]
type = "natural"

[io]
fill_value_missing = -32768.0   # true missing — no radar coverage
fill_value_clear   =  -9999.0   # scanned, no echo (clear air)
